<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f5f2ec"/>
  <!-- rabbit-hole motif: concentric rings drawing the eye inward -->
  <g transform="translate(950 315)" fill="none" stroke="#b8832a" stroke-opacity="0.16">
    <circle r="250" stroke-width="2"/>
    <circle r="195" stroke-width="2"/>
    <circle r="145" stroke-width="2"/>
    <circle r="100" stroke-width="2"/>
    <circle r="60" stroke-width="2"/>
  </g>
  <circle cx="950" cy="315" r="26" fill="#b8832a" fill-opacity="0.9"/>
  <!-- wordmark + tagline -->
  <text x="90" y="290" font-family="Georgia, 'Playfair Display', serif" font-style="italic" font-size="96" font-weight="700" fill="#b8832a">wikihole</text>
  <text x="96" y="360" font-family="'DM Mono', monospace" font-size="27" letter-spacing="2" fill="#6a6052">FALL DOWN THE WIKIPEDIA RABBIT HOLE —</text>
  <text x="96" y="398" font-family="'DM Mono', monospace" font-size="27" letter-spacing="2" fill="#6a6052">THEN ACTUALLY REMEMBER IT.</text>
  <text x="96" y="470" font-family="Georgia, serif" font-size="23" fill="#9a9082">Curated trails · built-in quizzes · spaced repetition</text>
  <rect x="90" y="208" width="64" height="5" rx="2.5" fill="#b8832a"/>
</svg>
